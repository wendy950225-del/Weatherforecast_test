name: 每日下雨機率偵測

on:
  schedule:
    - cron: "25 14 * * *"
      timezone: "Asia/Taipei"

  workflow_dispatch:
    inputs:
      force_notify:
        description: "強制發送 Telegram 測試通知"
        required: false
        default: false
        type: boolean

jobs:
  rain-check:
    runs-on: ubuntu-latest

    steps:
      - name: 下載程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Python 套件
        run: pip install -r requirements.txt

      - name: 檢查今天降雨機率
        run: python weather_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
          RAIN_THRESHOLD: ${{ vars.RAIN_THRESHOLD }}

          FORCE_NOTIFY: ${{ inputs.force_notify }}
